<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender - Браузерная игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 Space Defender</h1>
        <div class="game-info">
            <div class="score-panel">
                <span>Счёт: <span id="score">0</span></span>
                <span>Рекорд: <span id="highScore">0</span></span>
                <span>Жизни: <span id="lives">3</span></span>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameOver" class="game-over hidden">
            <h2>Игра окончена!</h2>
            <p>Ваш счёт: <span id="finalScore">0</span></p>
            <p>Рекорд: <span id="finalHighScore">0</span></p>
            <button id="restartBtn">Играть снова</button>
        </div>
        <div class="controls">
            <h3>Управление:</h3>
            <p>← → - движение влево/вправо</p>
            <p>ПРОБЕЛ - выстрел</p>
            <p>P - пауза</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
