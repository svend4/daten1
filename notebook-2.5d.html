<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📓 Блокнот 2.5D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #434343 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #notebook-canvas {
            flex: 1;
            display: block;
            cursor: grab;
            touch-action: none;
        }

        #notebook-canvas:active {
            cursor: grabbing;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border-radius: 15px;
            padding: 20px;
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .panel-title {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-secondary {
            background: #666;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .input-group {
            margin: 10px 0;
        }

        .input-group label {
            color: #fff;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }

        .input-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
        }

        .notes-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
        }

        .note-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .note-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #667eea;
            transform: translateX(5px);
        }

        .note-item-title {
            color: #fff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .note-item-preview {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stats {
            color: #fff;
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .stats-item {
            display: inline-block;
            margin: 0 10px;
        }

        .stats-number {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .editor-panel {
            display: none;
        }

        .editor-panel.active {
            display: block;
        }

        .toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 101;
            display: none;
        }

        .nav-buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 15px;
            z-index: 100;
        }

        .nav-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .nav-btn:disabled {
            opacity: 0.3;
        }

        .page-indicator {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            z-index: 100;
            display: none;
        }

        @media (max-width: 768px) {
            .control-panel {
                top: 0;
                right: -100%;
                left: auto;
                width: 90%;
                max-width: 400px;
                height: 100vh;
                max-height: none;
                border-radius: 0;
                transition: right 0.3s ease;
            }

            .control-panel.active {
                right: 0;
            }

            .toggle-btn {
                display: block;
            }

            .nav-buttons {
                display: flex;
            }

            .page-indicator {
                display: block;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <canvas id="notebook-canvas"></canvas>

        <button class="toggle-btn" id="toggleBtn">☰</button>

        <div class="page-indicator" id="pageIndicator">Нет заметок</div>

        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn">◀</button>
            <button class="nav-btn" id="nextBtn">▶</button>
        </div>

        <div class="control-panel" id="controlPanel">
            <div class="panel-title">📓 Блокнот 2.5D</div>

            <div id="listView">
                <div class="stats">
                    <div class="stats-item">
                        <div class="stats-number" id="noteCount">0</div>
                        <div class="stats-label">Заметок</div>
                    </div>
                    <div class="stats-item">
                        <div class="stats-number" id="wordCount">0</div>
                        <div class="stats-label">Слов</div>
                    </div>
                </div>

                <button class="btn btn-primary" id="newNoteBtn">➕ Новая Заметка</button>

                <div class="notes-list" id="notesList">
                    <div style="color: rgba(255,255,255,0.5); text-align: center; padding: 20px;">
                        Заметок пока нет
                    </div>
                </div>

                <button class="btn btn-success" id="exportBtn">💾 Экспорт</button>
            </div>

            <div id="editorView" class="editor-panel">
                <div class="input-group">
                    <label>📌 Заголовок:</label>
                    <input type="text" id="noteTitle" placeholder="Введите заголовок...">
                </div>

                <div class="input-group">
                    <label>✍️ Текст:</label>
                    <textarea id="noteContent" placeholder="Начните писать..."></textarea>
                </div>

                <button class="btn btn-primary" id="saveBtn">💾 Сохранить</button>
                <button class="btn btn-danger" id="deleteBtn" style="display: none;">🗑️ Удалить</button>
                <button class="btn btn-secondary" id="cancelBtn">❌ Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // Основные переменные
        const canvas = document.getElementById('notebook-canvas');
        const ctx = canvas.getContext('2d');
        let notes = [];
        let currentNoteId = null;
        let currentPage = 0;

        // Параметры анимации
        let notebookRotation = 0;
        let targetRotation = 0;
        let notebookTilt = 0;
        let targetTilt = 0;

        // Управление
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        // Инициализация canvas
        function initCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        // Рендеринг блокнота
        function renderNotebook() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            // Плавная анимация
            notebookRotation += (targetRotation - notebookRotation) * 0.1;
            notebookTilt += (targetTilt - notebookTilt) * 0.1;

            const scale = 1 + Math.sin(notebookTilt) * 0.1;
            ctx.scale(scale, scale);
            ctx.rotate(notebookRotation);

            const bookWidth = Math.min(350, canvas.width * 0.6);
            const bookHeight = Math.min(450, canvas.height * 0.7);

            // Тень
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(-bookWidth / 2 + 10, -bookHeight / 2 + 10, bookWidth, bookHeight);

            // Обложка
            const gradient = ctx.createLinearGradient(-bookWidth / 2, -bookHeight / 2, bookWidth / 2, bookHeight / 2);
            gradient.addColorStop(0, '#8b4513');
            gradient.addColorStop(0.5, '#654321');
            gradient.addColorStop(1, '#4a2511');

            ctx.fillStyle = gradient;
            ctx.fillRect(-bookWidth / 2, -bookHeight / 2, bookWidth, bookHeight);

            // Рамка
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 3;
            ctx.strokeRect(-bookWidth / 2 + 10, -bookHeight / 2 + 10, bookWidth - 20, bookHeight - 20);

            // Название
            ctx.fillStyle = '#f4e4c1';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.fillText('МОЙ БЛОКНОТ', 0, -100);
            ctx.font = 'bold 24px Arial';
            ctx.fillText('2.5D', 0, -60);
            ctx.shadowBlur = 0;

            // Страницы
            drawPages(bookWidth, bookHeight);

            // Закладка
            const bookmarkGrad = ctx.createLinearGradient(0, -bookHeight / 2, 0, bookHeight / 2);
            bookmarkGrad.addColorStop(0, '#ff0000');
            bookmarkGrad.addColorStop(1, '#990000');
            ctx.fillStyle = bookmarkGrad;
            ctx.fillRect(bookWidth / 2 - 25, -bookHeight / 2, 15, bookHeight + 30);

            ctx.restore();
        }

        function drawPages(w, h) {
            for (let i = 4; i >= 0; i--) {
                const depth = i * 3;
                const alpha = 0.3 + (i / 5) * 0.7;

                ctx.save();
                ctx.translate(-(5 - i) * 2, -(5 - i) * 2);

                // Тень страницы
                ctx.fillStyle = `rgba(0, 0, 0, ${0.2 * alpha})`;
                ctx.fillRect(-w / 2 + 15 + depth + 2, -h / 2 + 15 + depth + 2, w - 30, h - 30);

                // Страница
                const pageGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
                pageGrad.addColorStop(0, '#fffef0');
                pageGrad.addColorStop(1, '#f5f5dc');

                ctx.globalAlpha = alpha;
                ctx.fillStyle = pageGrad;
                ctx.fillRect(-w / 2 + 15 + depth, -h / 2 + 15 + depth, w - 30, h - 30);

                // Текст на первой странице
                if (i === 0 && notes.length > 0 && currentPage < notes.length) {
                    drawNoteText(notes[currentPage], w, h, depth);
                }

                ctx.restore();
            }
        }

        function drawNoteText(note, w, h, depth) {
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#000';
            ctx.font = 'bold 18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(note.title.substring(0, 30), 0, -h / 2 + 60 + depth);

            ctx.font = '14px Arial';
            ctx.textAlign = 'left';

            const maxWidth = w - 80;
            const lines = wrapText(note.content, maxWidth);
            let y = -h / 2 + 100 + depth;

            lines.slice(0, 10).forEach(line => {
                ctx.fillText(line, -w / 2 + 40, y);
                y += 25;
            });

            ctx.font = '11px Arial';
            ctx.fillStyle = '#666';
            ctx.textAlign = 'right';
            ctx.fillText(note.date, w / 2 - 40, h / 2 - 30 + depth);
        }

        function wrapText(text, maxWidth) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';

            ctx.font = '14px Arial';

            words.forEach(word => {
                const testLine = currentLine + word + ' ';
                const metrics = ctx.measureText(testLine);

                if (metrics.width > maxWidth && currentLine !== '') {
                    lines.push(currentLine);
                    currentLine = word + ' ';
                } else {
                    currentLine = testLine;
                }
            });

            if (currentLine) {
                lines.push(currentLine);
            }

            return lines;
        }

        // Управление мышью
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - lastX;
            const deltaY = e.clientY - lastY;
            targetRotation += deltaX * 0.01;
            targetTilt += deltaY * 0.005;
            targetTilt = Math.max(-0.3, Math.min(0.3, targetTilt));
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);

        // Touch управление
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                isDragging = true;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDragging && e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - lastX;
                const deltaY = e.touches[0].clientY - lastY;
                targetRotation += deltaX * 0.01;
                targetTilt += deltaY * 0.005;
                targetTilt = Math.max(-0.3, Math.min(0.3, targetTilt));
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => isDragging = false);

        // Работа с заметками
        function loadNotes() {
            try {
                const saved = localStorage.getItem('notebook25d_notes');
                if (saved) {
                    notes = JSON.parse(saved);
                }
            } catch (e) {
                console.error('Ошибка загрузки:', e);
                notes = [];
            }
            updateUI();
        }

        function saveNotes() {
            try {
                localStorage.setItem('notebook25d_notes', JSON.stringify(notes));
            } catch (e) {
                console.error('Ошибка сохранения:', e);
                alert('❌ Ошибка сохранения!');
            }
        }

        function updateUI() {
            renderNotesList();
            updateStats();
            updatePageIndicator();
            updateNavButtons();
        }

        function renderNotesList() {
            const container = document.getElementById('notesList');

            if (notes.length === 0) {
                container.innerHTML = `
                    <div style="color: rgba(255,255,255,0.5); text-align: center; padding: 20px;">
                        Заметок пока нет
                    </div>
                `;
            } else {
                container.innerHTML = notes.map((note, index) => `
                    <div class="note-item" data-id="${note.id}">
                        <div class="note-item-title">${note.title}</div>
                        <div class="note-item-preview">${note.content.substring(0, 50)}...</div>
                    </div>
                `).join('');

                document.querySelectorAll('.note-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = parseInt(item.dataset.id);
                        editNote(id);
                    });
                });
            }
        }

        function updateStats() {
            document.getElementById('noteCount').textContent = notes.length;
            const totalWords = notes.reduce((sum, note) => {
                return sum + note.content.split(/\s+/).filter(w => w).length;
            }, 0);
            document.getElementById('wordCount').textContent = totalWords;
        }

        function updatePageIndicator() {
            const indicator = document.getElementById('pageIndicator');
            if (notes.length === 0) {
                indicator.textContent = 'Нет заметок';
            } else {
                indicator.textContent = `Страница ${currentPage + 1} / ${notes.length}`;
            }
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage >= notes.length - 1 || notes.length === 0;
        }

        function showEditor() {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('editorView').classList.add('active');
        }

        function hideEditor() {
            document.getElementById('listView').style.display = 'block';
            document.getElementById('editorView').classList.remove('active');
        }

        function newNote() {
            currentNoteId = null;
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('deleteBtn').style.display = 'none';
            showEditor();
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;

            currentNoteId = id;
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('deleteBtn').style.display = 'block';
            showEditor();
        }

        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();

            if (!title && !content) {
                alert('⚠️ Заметка не может быть пустой!');
                return;
            }

            const note = {
                id: currentNoteId || Date.now(),
                title: title || 'Без названия',
                content: content,
                date: new Date().toLocaleString('ru-RU')
            };

            if (currentNoteId) {
                const index = notes.findIndex(n => n.id === currentNoteId);
                notes[index] = note;
            } else {
                notes.unshift(note);
                currentPage = 0;
            }

            saveNotes();
            hideEditor();
            updateUI();
        }

        function deleteNote() {
            if (!confirm('🗑️ Удалить эту заметку?')) return;

            notes = notes.filter(n => n.id !== currentNoteId);
            if (currentPage >= notes.length && currentPage > 0) {
                currentPage--;
            }

            saveNotes();
            hideEditor();
            updateUI();
        }

        function exportNotes() {
            if (notes.length === 0) {
                alert('📭 Нет заметок для экспорта!');
                return;
            }

            let text = '📓 БЛОКНОТ 2.5D\n';
            text += '═══════════════════════════════\n\n';

            notes.forEach((note, index) => {
                text += `${index + 1}. ${note.title}\n`;
                text += `Дата: ${note.date}\n`;
                text += `───────────────────────────────\n`;
                text += `${note.content}\n`;
                text += `═══════════════════════════════\n\n`;
            });

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Блокнот_2.5D_${new Date().toLocaleDateString('ru-RU').replace(/\./g, '-')}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert('✅ Заметки экспортированы!');
        }

        // События кнопок
        document.getElementById('newNoteBtn').addEventListener('click', newNote);
        document.getElementById('saveBtn').addEventListener('click', saveNote);
        document.getElementById('deleteBtn').addEventListener('click', deleteNote);
        document.getElementById('cancelBtn').addEventListener('click', hideEditor);
        document.getElementById('exportBtn').addEventListener('click', exportNotes);

        document.getElementById('toggleBtn').addEventListener('click', () => {
            const panel = document.getElementById('controlPanel');
            const btn = document.getElementById('toggleBtn');
            panel.classList.toggle('active');
            btn.textContent = panel.classList.contains('active') ? '✕' : '☰';
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                updateUI();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentPage < notes.length - 1) {
                currentPage++;
                updateUI();
            }
        });

        // Анимация
        function animate() {
            renderNotebook();
            requestAnimationFrame(animate);
        }

        // Запуск
        loadNotes();
        animate();
    </script>
</body>
</html>
